<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Editar</title>
    <link href="../src/style.css" rel="stylesheet" />
    <link rel="icon" type="image/x-icon" href="../src/favicon.ico" />
  </head>
  <body>
    <main>
      <h1 class="titulo">Editar Dados</h1>
      <hr />

      <p class="info">Selecione a Tabela para inserir os dados</p>
      <select id="select-tabela">
        <option value="autores">autores</option>
        <option value="generos">generos</option>
        <option value="livros">livros</option>
      </select>

      <form id="formulario-editar">
        <label for="select-dados">Selecione o valor que será alterado</label>
        <select id="select-dados">
          <option value="" disabled selected>Selecione uma opção</option>
        </select>
        <div id="container-campos"></div>

        <input
          class="botao-enviar"
          id="botao-editar"
          type="submit"
          name="editar"
          value="Editar"
        />
      </form>

      <hr />
      <a href="../index.html" class="home">Voltar para o início</a>
    </main>
    <script type="module" src="../src/script.js"></script>
  </body>
</html>
